name: Build Native Libraries

# Default for every job: read-only. The `commit` job below opts into
# `contents: write` for itself, so only the step that publishes the built
# binaries carries a writable token — the compile jobs never see one.
permissions:
  contents: read

on:
  push:
    paths:
      - 'Native~/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'Native~/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: xatlas-unity.dll
            plugin_dir: Plugins/x86_64
            cmake_args: -A x64
          - os: ubuntu-latest
            artifact: libxatlas-unity.so
            plugin_dir: Plugins/x86_64
            cmake_args: ''
          - os: macos-latest
            artifact: libxatlas-unity.dylib
            plugin_dir: Plugins/macOS
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=x86_64\;arm64'

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure CMake
        run: cmake -S 'Native~' -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.os }}
          path: ${{ matrix.plugin_dir }}/${{ matrix.artifact }}
          if-no-files-found: error

  # Publishes the freshly built binaries back into Plugins/ so a native
  # source change lands in the package without anyone copying files by hand.
  # Only runs for pushes to this repository (never for pull_request, so a
  # fork can never reach a writable token), and the commit carries [skip ci]
  # so it cannot retrigger this workflow.
  commit:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Copy binaries to plugin directories
        run: |
          # Windows
          mkdir -p Plugins/x86_64
          cp artifacts/native-windows-latest/xatlas-unity.dll Plugins/x86_64/

          # Linux
          cp artifacts/native-ubuntu-latest/libxatlas-unity.so Plugins/x86_64/

          # macOS (universal binary: x86_64 + arm64)
          mkdir -p Plugins/macOS
          cp artifacts/native-macos-latest/libxatlas-unity.dylib Plugins/macOS/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Plugins/
          if git diff --cached --quiet; then
            echo "No changes to native libraries"
          else
            git commit -m "Build native libraries (auto) [skip ci]"
            git push
          fi
