name: Build Native Libraries

# This workflow deliberately has no repository write permission. Native artifacts
# must be reviewed and committed by a maintainer rather than published by CI.
permissions:
  contents: read

on:
  push:
    paths:
      - 'Native~/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'Native~/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: xatlas-unity.dll
            plugin_dir: Plugins/x86_64
            cmake_args: -A x64
          - os: ubuntu-latest
            artifact: libxatlas-unity.so
            plugin_dir: Plugins/x86_64
            cmake_args: ''
          - os: macos-latest
            artifact: libxatlas-unity.dylib
            plugin_dir: Plugins/macOS
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=x86_64\;arm64'

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure CMake
        run: cmake -S 'Native~' -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.os }}
          path: ${{ matrix.plugin_dir }}/${{ matrix.artifact }}
          if-no-files-found: error
