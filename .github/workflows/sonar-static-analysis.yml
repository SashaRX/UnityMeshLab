name: SonarQube

# Static analysis of the package's C# on the self-hosted SonarQube Community Build,
# modelled on SashaRX/Space's sonar-static-analysis.yml.
#
# Community Build has no branch/PR analysis (no branch plugin, no PR decoration): a
# scan without a branch parameter REPLACES the project's single branch, so a PR scan
# into the main key would overwrite main's dashboard. Hence:
#
#   push to main       → the project itself (SONAR_PROJECT_KEY) with the Quality Gate
#                        ENFORCED (sonar.qualitygate.wait=true — a red gate reds the job).
#   pull_request       → a THROWAWAY project <key>_pr<N>_r<run id>_<attempt> (unique per
#                        run, so a cancelled run's cleanup never deletes a newer run's
#                        project). Tools~/sonar-pr-check.mjs keeps the OPEN issues on the
#                        lines the PR adds or modifies — the server's new-code period
#                        plays no part — publishes them (annotations, job summary, the
#                        `sonar-pr-findings-<N>` artifact), deletes the project, and
#                        gates: ANY new finding on a changed line reds the check, like
#                        the server gate's new_violations > 0 — except the ADVISORY rules
#                        (Tools~/sonar-pr-check.mjs: S3776, S3267, S3358, S1075), reported but
#                        not gating, and the rules switched off in the begin step below.
#                        A PR that changes the Sonar workflows or tools checks every open
#                        PR instead of only itself (the tooling is proven on the queue;
#                        only the triggering PR's own findings gate that run).
#   workflow_dispatch  → `prs` = "open" (every open PR), PR numbers, or "main".
#
# The findings bundle each PR check uploads (`sonar-pr-findings-<N>`: findings.json,
# prompt.md, selected.txt, summary.md) is what an autofix step would consume; none is
# wired here. The Sonar runbook in SashaRX/Space (docs/sonar-autofix.md) describes that
# loop; here the tools live in Tools~/ and the config in ~/.config/meshlab/.
#
# The C# build is the licence-free one from Tools~/compile_check.py, taken from THIS
# workflow's ref (an older PR may not carry the script): sources are copied into a
# build directory outside the checkout (reference-gap substitutions keep line numbers),
# so issues carry the repo-relative path and line; SCM blame is off for that reason.
#
# Secrets / variables (repository settings):
#   SONAR_TOKEN       — secret, the scanner's token. Throwaway projects are created on
#                       first analysis, so it needs Execute Analysis + Create Projects.
#   SONAR_API_TOKEN   — secret, optional: a USER token (squ_…) for the web API reads and
#                       the project deletes when SONAR_TOKEN is analysis-only.
#   SONAR_HOST_URL    — secret or variable, optional; defaults to the Mesh Lab server below.
#   SONAR_PROJECT_KEY — variable, optional; defaults to SashaRX_UnityMeshLab.
on:
  push:
    branches: [main]
    paths:
      - 'Editor/**'
      - 'Tests/**'
      - 'Tools~/compile_check.py'
      - 'Tools~/sonar-pr-check.mjs'
      - '.github/workflows/sonar-static-analysis.yml'
  pull_request:
    paths:
      - 'Editor/**'
      - 'Tests/**'
      - 'Tools~/compile_check.py'
      - 'Tools~/sonar-*'
      - '.github/workflows/sonar-*.yml'
  workflow_dispatch:
    inputs:
      prs:
        description: 'What to analyse: "open" (every open PR), PR numbers separated by commas, or "main"'
        default: 'open'
        required: true

# Nothing at the workflow level: every job declares its own.
permissions: {}

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL || 'http://178.104.156.174:9000' }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'SashaRX_UnityMeshLab' }}

jobs:
  plan:
    name: Decide what to analyse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      has-token: ${{ steps.probe.outputs.has-token }}
      matrix: ${{ steps.targets.outputs.matrix }}
      pr-matrix: ${{ steps.targets.outputs.pr-matrix }}
      has-prs: ${{ steps.targets.outputs.has-prs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools~/sonar-pr-check.mjs
          sparse-checkout-cone-mode: false

      - name: Probe token
        id: probe
        env:
          HAS_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          echo "has-token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::SONAR_TOKEN is not configured — add a SonarQube token as a repository secret to enable the scan."
            echo "### SonarQube scan skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`SONAR_TOKEN\` secret. Create a token on the server (My Account ▸ Security) and add it under Settings ▸ Secrets ▸ Actions — the Sonar runbook in SashaRX/Space (docs/sonar-autofix.md; here the tools live in Tools~/ and the config in ~/.config/meshlab/)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # One matrix entry per analysis: the Sonar project key, the commit to analyse and,
      # for a PR, its base (the diff base), head ref (the autofix push target), whether
      # it is same-repo (autofix eligibility) and whether its findings gate this run.
      - name: Collect targets
        id: targets
        if: steps.probe.outputs.has-token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          THIS_PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_PRS: ${{ github.event.inputs.prs }}
        run: |
          set -euo pipefail
          pr_entry() {
            gh pr view "$1" --json number,headRefOid,baseRefOid,headRefName,baseRefName,isCrossRepository \
              --jq "{key: \"${SONAR_PROJECT_KEY}_pr\(.number)_r${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}\", label: \"PR #\(.number) \(.headRefName) → \(.baseRefName)\", head: .headRefOid, base: .baseRefOid, pr: (.number|tostring), head_ref: .headRefName, same_repo: (.isCrossRepository|not)}" \
              | jq -c --arg event "$EVENT" --arg this "$THIS_PR" '. + {gate: (if $event == "pull_request" then (.pr == $this) else true end)}'
          }
          open_prs() { gh pr list --state open --limit 100 --json number --jq '.[].number'; }
          main_entry() { printf '{"key":"%s","label":"main","head":"%s","base":"","pr":"","head_ref":"","same_repo":false,"gate":true}\n' "$SONAR_PROJECT_KEY" "$HEAD_SHA"; }
          : > targets.jsonl
          case "$EVENT" in
            push) main_entry > targets.jsonl ;;
            workflow_dispatch)
              if [ "$INPUT_PRS" = "main" ]; then main_entry > targets.jsonl
              elif [ "$INPUT_PRS" = "open" ]; then for n in $(open_prs); do pr_entry "$n" >> targets.jsonl; done
              else for n in $(echo "$INPUT_PRS" | tr ',' ' '); do pr_entry "$n" >> targets.jsonl; done
              fi ;;
            pull_request)
              if gh pr diff "$THIS_PR" --name-only | grep -Eq '^(\.github/workflows/sonar-.*\.yml|Tools~/sonar-.*)$'; then
                echo "::notice::This PR changes the SonarQube workflows or tools — checking every open PR with them."
                for n in $(open_prs); do pr_entry "$n" >> targets.jsonl; done
              else
                pr_entry "$THIS_PR" > targets.jsonl
              fi ;;
          esac
          jq -c -s '{include: .}' targets.jsonl > matrix.json
          jq -c -s '{include: map(select(.pr != "" and .same_repo))}' targets.jsonl > pr-matrix.json
          {
            echo "matrix=$(cat matrix.json)"
            echo "pr-matrix=$(cat pr-matrix.json)"
            echo "has-prs=$(jq -r 'if (.include | length) > 0 then "true" else "false" end' pr-matrix.json)"
          } >> "$GITHUB_OUTPUT"
          echo "Targets:"; jq -r '.include[] | "  \(.label)  \(.key)  gate=\(.gate)"' matrix.json

      # A run cancelled between its scan and its delete step leaves its throwaway project
      # on the server. Every run lists the repository's throwaway projects and deletes
      # those whose GitHub run is over; a run still going keeps its project.
      - name: Delete orphan throwaway projects
        if: steps.probe.outputs.has-token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
        run: |
          set -uo pipefail
          if ! node Tools~/sonar-pr-check.mjs throwaways --prefix "$SONAR_PROJECT_KEY" > throwaways.txt; then
            echo "::warning::Could not list the throwaway projects; skipping the orphan cleanup."
            exit 0
          fi
          orphans=()
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            run="${key##*_r}"; run="${run%_*}"
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            status="$(gh run view "$run" --json status --jq .status 2>/dev/null || echo gone)"
            case "$status" in
              in_progress|queued|waiting|requested|pending) echo "  keeping $key (run $run is $status)" ;;
              *) orphans+=("$key") ;;
            esac
          done < throwaways.txt
          if [ "${#orphans[@]}" -eq 0 ]; then echo "No orphan throwaway projects."; exit 0; fi
          args=(); for key in "${orphans[@]}"; do args+=(--project "$key"); done
          node Tools~/sonar-pr-check.mjs delete "${args[@]}"

  scan:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      KEY: ${{ matrix.key }}
      LABEL: ${{ matrix.label }}
      HEAD: ${{ matrix.head }}
      BASE: ${{ matrix.base }}
      PR: ${{ matrix.pr }}
    steps:
      # The workflow's own ref carries the build and check tools; the analysed commits may not.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: tooling
          sparse-checkout: |
            Tools~/compile_check.py
            Tools~/sonar-pr-check.mjs
            Tools~/sonar-pr-check.test.mjs
            .github/workflows/sonar-static-analysis.yml
          sparse-checkout-cone-mode: false

      # Full history: the PR's merge base must be present for the diff.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: src
          ref: ${{ matrix.head }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages and the scanner
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('tooling/Tools~/compile_check.py', 'tooling/.github/workflows/sonar-static-analysis.yml') }}

      - name: Self-test the findings tool
        run: node --test tooling/Tools~/sonar-pr-check.test.mjs

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      # Prepare the licence-free build of the analysed checkout into a directory outside
      # it, then begin / build / end in that directory (begin sets the MSBuild targets up
      # for this shell only). Main waits for the gate; a PR's gate is the step below.
      - name: Analyse
        id: scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compile-check"
          python3 tooling/Tools~/compile_check.py --prepare-only --root src --out "$out"
          version="$(jq -r .version src/package.json)+${HEAD:0:7}"
          if [ -n "$PR" ]; then
            NAME="Mesh Lab - PR #$PR (throwaway)"; QG_WAIT=false
          else
            NAME="Mesh Lab"; QG_WAIT=true
          fi
          # Rules switched off as a whole, decided once here rather than issue by issue
          # (Tools~/sonar-pr-check.mjs holds the ADVISORY rules, reported but not gating):
          #   S125  commented-out code — matches this repo's prose comments (formulae,
          #         operator names, the pipeline's step-by-step notes).
          #   S1104 public fields — the tool context, settings and recorder rows are
          #         plain data holders in the Unity editor style.
          #   S107  too many parameters — the geometry math takes vectors as scalars on
          #         purpose (no per-call allocation).
          #   S1168 return null instead of an empty collection — null means "absent"
          #         (no such UV channel, no colours, encode failed) throughout the code
          #         base and every caller tests for it; an empty collection would erase
          #         the difference between "none" and "empty".
          #   S1215 GC.Collect — in Editor/Bench only: the sweep collects between cells so
          #         the next cell's memory and timing do not carry the last one's garbage;
          #         everywhere else the rule stays on.
          IGNORE_IDS="s125,s1104,s107,s1168,s1215"
          IGNORE_ARGS=""
          for id in s125 s1104 s107 s1168; do
            IGNORE_ARGS="$IGNORE_ARGS /d:sonar.issue.ignore.multicriteria.$id.ruleKey=csharpsquid:${id^^} /d:sonar.issue.ignore.multicriteria.$id.resourceKey=**/*"
          done
          IGNORE_ARGS="$IGNORE_ARGS /d:sonar.issue.ignore.multicriteria.s1215.ruleKey=csharpsquid:S1215 /d:sonar.issue.ignore.multicriteria.s1215.resourceKey=Editor/Bench/**"
          cd "$out"
          # IGNORE_ARGS is deliberately word-split into flags.
          # shellcheck disable=SC2086
          dotnet sonarscanner begin \
            /k:"$KEY" \
            /n:"$NAME" \
            /v:"$version" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scm.disabled=true \
            /d:sonar.exclusions="Shims/**" \
            /d:sonar.cs.file.suffixes=".cs" \
            /d:sonar.issue.ignore.multicriteria="$IGNORE_IDS" \
            $IGNORE_ARGS \
            /d:sonar.qualitygate.wait="$QG_WAIT"
          dotnet build MeshLab.sln -nologo -v q --no-incremental -p:MeshLabFbx=true
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN" 2>&1 | tee "$RUNNER_TEMP/sonar-end.log"
          # The server processes the report asynchronously; the PR check waits on this
          # compute-engine task before it reads any issue.
          TASK="$(find .sonarqube -name report-task.txt -exec grep -h '^ceTaskId=' {} + 2>/dev/null | head -n 1 | cut -d= -f2)"
          if [ -z "$TASK" ]; then
            TASK="$(grep -oE 'api/ce/task\?id=[A-Za-z0-9_-]+' "$RUNNER_TEMP/sonar-end.log" | tail -n 1 | cut -d= -f2)"
          fi
          echo "ce_task=$TASK" >> "$GITHUB_OUTPUT"

      # Web API reads and the project delete try SONAR_API_TOKEN, then SONAR_TOKEN
      # (Tools~/sonar-pr-check.mjs): they need a USER token, which either may be.
      - name: Wait for the server to process the scan
        id: wait
        if: matrix.pr != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
          TASK: ${{ steps.scan.outputs.ce_task }}
        run: |
          if [ -z "$TASK" ]; then
            echo "::error::The scan reported no compute-engine task id."
            exit 1
          fi
          node tooling/Tools~/sonar-pr-check.mjs wait --task-id "$TASK"

      # The diff the scan saw: merge-base(base, head)..head of the PR branch itself.
      - name: Findings on the lines this PR changes
        id: findings
        if: steps.wait.outcome == 'success'
        working-directory: src
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
        run: |
          set -euo pipefail
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          node ../tooling/Tools~/sonar-pr-check.mjs pr-findings \
            --project "$KEY" --base "$MERGE_BASE" --head "$HEAD" --pr "$PR" --max 12 \
            --out-dir "$RUNNER_TEMP/sonar-pr-findings"

      # Always uploaded for a PR (an empty bundle too): the autofix job reads it.
      - name: Upload findings for the autofix loop
        if: steps.findings.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sonar-pr-findings-${{ matrix.pr }}
          path: ${{ runner.temp }}/sonar-pr-findings
          retention-days: 7

      - name: Delete the throwaway PR project
        if: always() && matrix.pr != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
        run: node tooling/Tools~/sonar-pr-check.mjs delete --project "$KEY"

      - name: Gate
        if: always() && matrix.pr != ''
        env:
          SCAN: ${{ steps.scan.outcome }}
          FINDINGS: ${{ steps.findings.outcome }}
          TOTAL: ${{ steps.findings.outputs.total }}
          SEVERE: ${{ steps.findings.outputs.severe }}
          ADVISORY: ${{ steps.findings.outputs.advisory }}
          GATES: ${{ matrix.gate }}
        run: |
          if [ "$FINDINGS" != "success" ]; then
            echo "::error::The Sonar PR check did not complete (scan: $SCAN) — see the steps above."
            exit 1
          fi
          if [ "${TOTAL:-0}" != "0" ]; then
            if [ "$GATES" = "true" ]; then
              echo "::error::$TOTAL new gating Sonar finding(s) on lines this PR changes ($SEVERE severe, ${ADVISORY:-0} advisory besides) — see the job summary."
              exit 1
            fi
            echo "::warning::$LABEL: $TOTAL new gating Sonar finding(s) on its changed lines ($SEVERE severe, ${ADVISORY:-0} advisory besides); that PR's own check gates it."
            exit 0
          fi
          echo "Sonar PR check passed: no new gating findings on the lines this PR changes (${ADVISORY:-0} advisory)."

      # WHY the gate said what it said (main only): the per-condition verdicts.
      - name: Summarize the main analysis
        if: always() && matrix.pr == ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
        run: |
          {
            echo "## SonarQube — main"
            echo ""
            echo "[$KEY]($SONAR_HOST_URL/dashboard?id=$KEY) — analysed \`${HEAD:0:7}\`, Quality Gate enforced (a red gate reds this job)."
            echo ""
            echo '```json'
            curl -sS -m 15 -H @<(printf 'Authorization: Bearer %s\n' "$SONAR_TOKEN") \
              "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$KEY" || echo '{"error":"gate status not read"}'
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One table for the whole run: every checked PR with its gating / severe / advisory
  # counts and the gating findings themselves, from the bundles the scan jobs uploaded.
  # One autofix call per checked same-repo PR, right after its scan published the
  # findings bundle. The called workflow decides on its own whether there is anything
  # to do (open PR, trusted author, head unchanged, a non-empty bundle) and runs on the
  # self-hosted runner where the subscription CLIs are logged in (vars.CI_RUNNER).
  autofix:
    name: Autofix
    needs: [plan, scan]
    if: always() && needs.plan.outputs.has-prs == 'true' && needs.scan.result != 'skipped' && needs.scan.result != 'cancelled'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.pr-matrix) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: ./.github/workflows/sonar-autofix.yml
    with:
      pr_number: ${{ matrix.pr }}
      head_sha: ${{ matrix.head }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

  summary:
    name: Findings across the checked PRs
    needs: [plan, scan]
    if: always() && needs.plan.outputs.has-prs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sonar-pr-findings-*
          path: ${{ runner.temp }}/findings

      - name: Tabulate
        run: |
          set -euo pipefail
          {
            echo "## SonarQube — findings on the changed lines of every checked PR"
            echo ""
            echo "| PR | Gating | Severe | Advisory |"
            echo "|---|---|---|---|"
            for d in "$RUNNER_TEMP"/findings/sonar-pr-findings-*/; do
              [ -f "$d/findings.json" ] || continue
              n="$(basename "$d" | sed 's/sonar-pr-findings-//')"
              jq -r --arg pr "$n" '.findings as $f
                | "| #\($pr) | \($f | map(select(.advisory | not)) | length) | \($f | map(select((.advisory | not) and .severe)) | length) | \($f | map(select(.advisory)) | length) |"' "$d/findings.json"
            done | sort -t'#' -k2 -n
            echo ""
            for d in "$RUNNER_TEMP"/findings/sonar-pr-findings-*/; do
              [ -f "$d/findings.json" ] || continue
              n="$(basename "$d" | sed 's/sonar-pr-findings-//')"
              if [ "$(jq '[.findings[] | select(.advisory | not)] | length' "$d/findings.json")" = "0" ]; then continue; fi
              echo "<details><summary>PR #$n — gating findings</summary>"
              echo ""
              jq -r '.findings[] | select(.advisory | not) | "- `\(.rule)` \(.label) — `\(.path):\(.line // "")` \(.message | gsub("[\r\n]+"; " "))"' "$d/findings.json"
              echo ""
              echo "</details>"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
